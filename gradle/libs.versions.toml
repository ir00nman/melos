[versions]
kotlin = "2.3.21"
compose = "1.10.3"
coroutines = "1.10.2"
serialization = "1.11.0"
murglar-plugins = "9.0"
vlcj = "4.12.1"
jaudiotagger = "3.0.1"
javafx = "21.0.13"

[libraries]
murglar-core = { module = "com.github.badmannersteam.murglar-plugins:core", version.ref = "murglar-plugins" }
vlcj = { module = "uk.co.caprica:vlcj", version.ref = "vlcj" }
coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
jaudiotagger = { module = "net.jthink:jaudiotagger", version.ref = "jaudiotagger" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
