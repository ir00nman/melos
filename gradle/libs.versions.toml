[versions]
kotlin = "2.3.21"
compose = "1.10.3"
coroutines = "1.10.2"
serialization = "1.11.0"
murglar-plugins = "9.0"
vlcj = "4.12.1"
jaudiotagger = "3.0.1"
javafx = "21.0.13"
agp = "8.13.2"
libvlc-android = "3.7.7"
okhttp = "5.1.0"
compose-bom = "2026.06.01"
activity = "1.11.0"

[libraries]
murglar-core = { module = "com.github.badmannersteam.murglar-plugins:core", version.ref = "murglar-plugins" }
vlcj = { module = "uk.co.caprica:vlcj", version.ref = "vlcj" }
coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
jaudiotagger = { module = "net.jthink:jaudiotagger", version.ref = "jaudiotagger" }
libvlc-android = { module = "org.videolan.android:libvlc-all", version.ref = "libvlc-android" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
agp = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
